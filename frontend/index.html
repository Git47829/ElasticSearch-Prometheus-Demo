<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logger Client Control</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 1.5rem auto; padding: 0 1rem; }
  h1 { margin-bottom: .25rem; }
  fieldset { margin-bottom: 1rem; padding: 1rem; border: 1px solid #888; border-radius: 6px; }
  legend { font-weight: 600; padding: 0 .5rem; }
  label { display: inline-block; min-width: 72px; }
  input[type=text], input[type=number] { padding: 4px 6px; }
  input[type=range] { width: 100%; }
  button { padding: .5rem 1rem; cursor: pointer; border-radius: 4px; border: 1px solid #888; background: #fff; }
  button.start { background: #2c7a3e; color: #fff; border-color: #1f5a2d; }
  button.stop  { background: #c8392b; color: #fff; border-color: #8c281f; }
  .status-bar { display: flex; gap: 1.5rem; padding: .6rem 1rem; background: #f1f1f1; border-radius: 6px; margin-bottom: 1rem; align-items: center; }
  .pill { padding: 2px 10px; border-radius: 10px; color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .03em; }
  .pill.on { background: #2c7a3e; }
  .pill.off { background: #888; }
  .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin: .35rem 0; }
  .row > label { min-width: 64px; }
  .log { background: #111; color: #d6ffd6; font-family: ui-monospace, monospace; padding: .75rem; height: 360px; overflow-y: auto; border-radius: 6px; font-size: 12px; }
  .entry { padding: 4px 0; border-bottom: 1px solid #2a2a2a; white-space: pre-wrap; }
  .entry .meta { color: #6fc; }
  .entry.err .meta { color: #f88; }
  .rate-value { display: inline-block; min-width: 4em; font-variant-numeric: tabular-nums; font-weight: 600; }
</style>
</head>
<body x-data='{
    status: { running: false, index: "", counter: 0 },
    indexInput: "testlog",
    rate: 10,
    async refresh() {
      try {
        const r = await fetch("/api/documents/status");
        if (r.ok) this.status = await r.json();
      } catch(e) {}
    }
  }' x-init="refresh(); setInterval(()=>refresh(), 1000)" hx-swap="none">

  <h1>Logger Client</h1>
  <p>Drive FizzBuzz inserts into Elasticsearch.</p>

  <div class="status-bar">
    <span>Worker:
      <span class="pill" :class="status.running ? 'on' : 'off'"
            x-text="status.running ? 'RUNNING' : 'STOPPED'"></span>
    </span>
    <span>Index: <strong x-text="status.index || '—'"></strong></span>
    <span>Counter: <strong x-text="status.counter"></strong></span>
  </div>

  <fieldset>
    <legend>1. Create Index</legend>
    <form hx-post="/api/index" class="row">
      <label>Index</label>
      <input type="text" name="id" x-model="indexInput" required>
      <button type="submit">Create</button>
    </form>
  </fieldset>

  <fieldset>
    <legend>2. Worker control (semaphore)</legend>

    <form hx-post="/api/documents/start" class="row" x-show="!status.running">
      <label>Index</label>
      <input type="text" name="index" x-model="indexInput" required>
      <label>Rate</label>
      <input type="number" name="rate" min="1" max="2000" :value="rate" @input="rate = +$event.target.value">
      <button type="submit" class="start">▶ START (open semaphore)</button>
    </form>

    <form hx-post="/api/documents/stop" class="row" x-show="status.running">
      <button type="submit" class="stop">■ STOP (close semaphore)</button>
    </form>

    <div class="row">
      <label>Rate</label>
      <input type="range" min="1" max="2000" step="1"
             x-model.number="rate"
             name="rate"
             hx-post="/api/documents/rate"
             hx-trigger="change delay:150ms"
             :disabled="!status.running">
      <span class="rate-value"><span x-text="rate"></span>/s</span>
    </div>
    <div class="row" x-show="!status.running" style="color:#888; font-size:12px;">
      Rate slider live-updates the worker while it is running.
    </div>
  </fieldset>

  <fieldset>
    <legend>3. Query documents</legend>
    <form hx-get="/api/documents/query" class="row">
      <label>Index</label>
      <input type="text" name="index" x-model="indexInput" required>
      <label>Payload</label>
      <input type="text" name="payload" placeholder="fizz | buzz | fizzbuzz | (empty)">
      <label>Size</label>
      <input type="number" name="size" value="10" min="1" max="1000">
      <button type="submit">Query</button>
    </form>
  </fieldset>

  <h2>Response log</h2>
  <div id="log" class="log"></div>

  <script>
    document.body.addEventListener('htmx:afterRequest', (evt) => {
      const xhr = evt.detail.xhr;
      const cfg = evt.detail.requestConfig;
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = 'entry' + (xhr.status >= 400 ? ' err' : '');
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `[${time}] ${cfg.verb.toUpperCase()} ${cfg.path} → ${xhr.status}`;
      const body = document.createElement('div');
      try {
        body.textContent = JSON.stringify(JSON.parse(xhr.responseText), null, 2);
      } catch {
        body.textContent = xhr.responseText;
      }
      entry.appendChild(meta);
      entry.appendChild(body);
      const log = document.getElementById('log');
      log.insertBefore(entry, log.firstChild);
    });
  </script>
</body>
</html>
